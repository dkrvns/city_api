[project]
name = "city-api"
version = "0.1.0"
description = ""
authors = [{ name = "dkrvns", email = "danila.krn@gmail.com" }]
requires-python = "~=3.11"
readme = "README.md"
dependencies = [
    "adaptix>=3.0.0b11,<4",
    "fastapi>=0.116.1,<0.117",
    "dishka>=1.6.0,<2",
    "sqlalchemy>=2.0.43,<3",
    "ruff>=0.12.11,<0.13",
    "alembic>=1.16.5,<2",
    "psycopg>=3.2.9,<4",
    "dotenv>=0.9.9,<0.10",
    "uvicorn>=0.35.0,<0.36",
    "pytest>=8.4.2,<9",
    "faker>=37.8.0,<38",
    "pytest-asyncio>=1.2.0,<2",
    "httpx>=0.28.1,<0.29",
    "bcrypt>=4.3.0,<5",
    "pyjwt>=2.10.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
